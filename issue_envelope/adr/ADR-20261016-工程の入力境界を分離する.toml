id = "ADR-20261016-工程の入力境界を分離する"
topic = "工程の入力境界を分離する"
decided_at = 2026-10-16
phase = "solution_planning"
recorded_by = "Codex (AI)"
affected_assets = [".ai/agents/creation-stage-contract.md", ".ai/skills/issue-pipeline/SKILL.md", "codex_worktree_exec/profile_pin.py", "issue_envelope/schema.py"]
supersedes = ""
owner_decision_refs = ["FBK-20261017-工程別worktreeへ同一branchを継承する"]

[[source]]
issue = 371
pr = 0

[context]
problem = '''
既存の実装者へ調査・検証設計・解決設計が集中し、検証設計の自己承認と権限の混線が生じる。
'''
constraints = '''
既存#540のADR/refと#603のClaude主文脈境界を維持し、新run ledgerと#375 capture本体を作らない。
'''

[decision]
chosen = '''
CP/VDの同型木と独立work unit DAGをissue_envelopeに置き、工程artifactの検証と実行者の起動束縛を分離する。新工程はClaude専用roleとしCodexは元roleの実行profileで使う。
旧1.0 OPEN PRのfixer後native再レビューだけは専用read-only入力を設け、通常2.0 phase承認と適用を区別する。
fresh defaultを取得しfirst-parent履歴のpolicy major1→2実導入点を導出、PR作成時刻/旧policy tree/導入点非祖先と
新工程artifact・author履歴なしを照合する。same-repo OPEN PR/head branch/remote exactOID/取得commit treeと、
最新fixerの終了・回収・解放済みreceipt bytesを照合する。欠落markerやlegacy自己申告では許可しない。
共有base面の既存レビュー契約を維持し、PR対象OIDとbase HEADを区別する。Codex例外や別オーケストレータは作らない。
'''
rationale = '''
既存DocSpec/ref adapterを直接再利用し、欄名依存と二重ledgerを増やさずproducer/run/Issue/digest/OIDの境界を検査できる。
旧PRへ存在しない新工程artifactを要求すると既存review/fixループが断絶するため、客観条件付きread-only互換に限定する。
開発commitのSHA/任意日時を移行規範にはしない。実default導入前に1.0運用で作られたPRも実導入点で識別できる。
'''
tracking_status = "filed"
tracking_issue = 652
no_tracking_reason = ''

[[alternatives]]
option = '''
固定frame/shard二分と新台帳を作る
'''
rejection_reason = '''
既決の同型木と導出可能な状態を保持しない原則に反する。
'''

[[alternatives]]
option = '''
未merge profileのpin基準を変更して実測する
'''
rejection_reason = '''
main版との完全一致という既存信頼境界を弱めるため採用しない。
'''

[consequences]
positive = '''
1a/1b/2a/2bを独立審査し、入力不一致と権限越境をfail-closeできる。
'''
negative = '''
dispatchと独立コンテキストの追加コストがある。未merge profileの実dispatch成功は確認できない。
'''
followups = '''
merge後一回実測は #652（parent #368）、設計はissue_envelope/verify/designs/post-merge-verification-371.mdで追跡する。
worktree継承は FBK-20261017-工程別worktreeへ同一branchを継承する に従い、各作者専用isolated worktreeへ同branchのremote exact OIDを継承する。
前作者自身のcommit/push、完了receipt回収、終了、collect/release完了を照合する。native入口はavailable。
旧版では同一worktree/adopt矛盾をownerへ提示して有効化を保留していた。これは決定前の履歴である。
未merge Codex profileのD1拒否を保持し、#652のlive実測成功は未確認。旧PR互換の実Git/実parser/PreToolUse受理はunit証拠であり製品live dispatch成功ではない。#537へLEDGER_SPEC確認を引き渡す。
'''
