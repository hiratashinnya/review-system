[[alternatives]]
option = '''
固定frame/shard二分と新台帳を作る
'''
rejection_reason = '''
既決の同型木と導出可能な状態を保持しない原則に反する。
'''

[[alternatives]]
option = '''
未merge profileのpin基準を変更して実測する
'''
rejection_reason = '''
main版との完全一致という既存信頼境界を弱めるため採用しない。
'''

[consequences]
positive = '''
1a/1b/2a/2bを独立審査し、入力不一致と権限越境をfail-closeできる。
'''
negative = '''
dispatchと独立コンテキストの追加コストがある。未merge profileの実dispatch成功は確認できない。
'''
followups = '''
merge後一回実測のverification起票案はissue_envelope/verify/designs/post-merge-verification-371.md。同一worktree/adoptの矛盾はownerへ比較案を提示中で、有効化を保留。#537へLEDGER_SPEC確認を引き渡す。
'''
