## Codex サブエージェント固有の中断対策

- サブエージェントの作業が完了し、結果を確認できるまで、このターンを終了・中断しない。
- サブエージェントが時間を要する場合は進捗を確認し、結果を受け取ってから最終回答する。

## 共通本文

このエージェントの共通本文は `./.ai/agents/issue-fixer.md` にあります。必ず読み、その指示に従う。

## Codex 固有の機械ゲート・権限境界

- `collaboration.spawn_agent` transportはchild/effective workspace・actual agent identity・spawn成功をtrusted観測できないためunavailableであり、issue-start hookがfail-closeする。正規Codex経路はrepo supervisorがIssue専用worktreeで別CLI processを起動し、OS PID/start tokenとJSONL threadを束縛する方式に限る。host mainのwrapper+common digestと対象branchが一致した場合だけ起動し、clean hostにもtask専用durable session stateを作ってrolloutを保存する。inner processはkarte診断・修正・test・schema v1 `pre_publish` handoffまででSTOPし、commit/pushはowner process fence・内容を含む段間Git facts CAS・main ledgerのowner-approved protected path/base digestを使うhost fixer state machineへ戻す。
- supervised innerはgenerated `issue-supervised` permission profileが`:workspace`を継承して与えるworkspace-write相当の境界でdirect `codex exec -C`を実行し、literal `--sandbox`は使用しない。data-plane network、raw auth env、nested Codexのmodel/API到達は禁止する。local thread生成だけは成功証拠にせず、到達失敗を残余リスクとして記録する。最初のturnはworktree read-only・task-private proposal directoryだけwrite可能な診断phaseであり、host Attempt登録後の同一thread resumeで編集へ進む。host publishはpush後に同一Attemptをcloseし、中央Result一致後にだけfinalを生成する。
- `.codex/hooks/agent-command-gate.sh` が `issue-fixer` を機械的に識別する。`push` と `gh pr create` は許可し、`git merge` / `gh pr merge` は拒否する。**本ロールにだけ `python3 -m gitgate adopt-branch <branch> --repository OWNER/REPO --expected-oid <40-HEX> [--pr <N>]` を許可する**（Issue #354・是正対象 PR ブランチを取得する Step 0 で使う。`issue-implementer` には付与しない）。`python3 -m karte` は本ロールだけに許可し、`render` / `append` / `close-attempt` / `check` / `status` に限定する。是正後はSTOPし、マージは `pr-reviewer` に委ねる。
- Bashの先頭コマンドは `gh` または `pyright` または `python3 -m {gitgate,unittest,coverage,dsv2,karte,asset_parity,time_fixture_lint}` に限る。git操作は `python3 -m gitgate` の `status` / `read` / `add` / `commit` / `push` / `branch-current` / `new-branch` / `fetch` / `diff` / `log` / `adopt-branch` だけ、`gh` は `pr create` / `issue view` だけとする。`asset_parity`/`time_fixture_lint` は `check` サブコマンドのみ（read-only 監査）。`pyright` は診断用フラグと型検査対象ファイルの指定は自由だが、書込系（`--createstub`）・対話系（`-w`/`--watch`）・インタプリタ起動や設定ファイル読込を伴うフラグ（`--pythonpath`/`--venvpath`/`-v`/`--project`/`-p`/`--typeshedpath`）は拒否される（Issue #510→F-510-06）。`ingest-review`、`pytest`、生の `git`、shell記号、チェイン、リダイレクト、コマンド置換、複数行コマンドは拒否される前提で使わない。
- コミットメッセージ、PR本文、karteの長文引数はファイル渡し形式を使う。フックは静的文字列検査であり完全なsandboxではないため、フック外の経路で禁止権限を得ようとしない。
- 編集前に `python3 -m gitgate status`、`branch-current`、`log -n 1 --oneline`、`read .codex/agents/issue-fixer.toml`、`read .ai/agents/issue-fixer.md`、`diff --stat HEAD` を各1回ずつ単独で実行し、host提示のブランチ・OID・役割本文・対象ファイルと照合する。`read` は作業場所からの相対パス1つだけを受け付け、シェル記号、連結、リダイレクト、シンボリックリンク、通常ファイル以外を拒否する。

## Codex 固有の委譲・入力境界

- corpus ノード（doc-system-v2/nodes/**）を要する変更に当たったら、直接編集せず STOP して呼び出し元（主文脈）へ報告する。委譲経路（`*-author`→`reconciliation-validator`→`reconciliation`）の実行は本ロールでは行えない（本ロールはサブエージェント委譲手段を保有しない・共通本文と同一・F-510-05）。
- **カルテのパスは渡されない（Issue #354・K2）**。`python3 -m karte <verb> --issue <N> --round <R>` でのみ触り、パスを自分で組み立てない。supervised Codexの handoff_path は親AI/CLIの入力ではなく、hostがmanifestのrole別 handoff_template をcanonical ledgerと照合して機械導出し、host promptへexact 1回だけ提示する。その提示された相対パスだけへ安全検査後に書く。共通本文の検査を相対解決やCLI任せにしない。
- supervised Codexのrole promptには、`handoff_path`、`branch_name`、`repository`、`expected_oid`を`Host-derived execution facts`としてhostが一括提示する。4値はcanonical ledgerとlive Git factsから導出され、親runtimeの入力には追加しない。snapshot本文の実handoff file candidateやhost authority/prompt reserved placeholderは権威値として扱わない。bareな`tmp/_handoff/`説明、reservedでない一般placeholder、通常コード断片は単一format passのsnapshot dataとして許可される。
- 呼び出し元 agent_type が gated ロール（issue-implementer/issue-fixer/pr-reviewer）のとき、`spawn_agent`/`Agent`/`collaborationspawn_agent` dispatch は `issue_start/gate.py` の `_caller_agent_type`／`GATED_ROLES` 判定（`.codex/hooks/issue-start-gate.sh` 経由・Claude 版 `issue-start-gate.sh` と共有実装・Issue #517）により、dispatch 先を問わず fail-close される。
- `.codex/hooks/agent-command-gate.sh` の role 判定と permission boundary を迂回しない。許可されない command、workspace 外の書き込み、merge は fail-close で停止する。

## Claude 版との transport 非対称

Claude は Agent tool の `isolation: "worktree"` が worktree と SubagentStart identity を提供する。
Codex の `spawn_agent` に isolation/workspace パラメータは無く、PreToolUse も各 tool の実効
workdir と actual agent identity を運ばないため、このtransportは unavailable のまま fail-close する。
Codex fixerはrepo supervisorの別process経路だけを正規経路とし、外側OS sandbox、内側Codex sandbox、
JSONL/process evidence、host publish gateの全条件が揃わない場合は起動しない。
詳細＝`.ai/rationale/issue-fixer.md`。
