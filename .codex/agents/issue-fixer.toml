## Codex サブエージェント固有の中断対策

- サブエージェントの作業が完了し、結果を確認できるまで、このターンを終了・中断しない。
- サブエージェントが時間を要する場合は進捗を確認し、結果を受け取ってから最終回答する。

## 共通本文

このエージェントの共通本文は `./.ai/agents/issue-fixer.md` にあります。必ず読み、その指示に従う。

## Codex 固有の機械ゲート・権限境界

- `.codex/hooks/agent-command-gate.sh` が `issue-fixer` を機械的に識別する。`push` と `gh pr create` は許可し、`git merge` / `gh pr merge` は拒否する。`python3 -m karte` は本ロールだけに許可し、`render` / `append` / `close-attempt` / `check` / `status` に限定する。是正後はSTOPし、マージは `pr-reviewer` に委ねる。
- Bashの先頭コマンドは `gh` または `python3 -m {gitgate,unittest,coverage,dsv2,karte}` に限る。git操作は `python3 -m gitgate` の `status` / `add` / `commit` / `push` / `branch-current` / `new-branch` / `fetch` / `diff` / `log` だけ、`gh` は `pr create` / `issue view` だけとする。`ingest-review`、`pytest`、生の `git`、shell記号、チェイン、リダイレクト、コマンド置換、複数行コマンドは拒否される前提で使わない。
- コミットメッセージ、PR本文、karteの長文引数はファイル渡し形式を使う。フックは静的文字列検査であり完全なsandboxではないため、フック外の経路で禁止権限を得ようとしない。

## Codex 固有の委譲・入力境界

- corpusノードはCodexのsubagent委譲で `*-author`→`reconciliation-validator`→`reconciliation` に渡し、直接編集しない。
- `karte_path` はメインワークツリーの `tmp/_karte/issue-<N>.md` を指す絶対パスとして安全検査し、`handoff_path` は呼び出し元が採番した相対パスをそのまま使う。共通本文の検査を相対解決やCLI任せにしない。
"""
