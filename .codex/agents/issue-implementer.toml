## Codex サブエージェント固有の中断対策

- サブエージェントの作業が完了し、結果を確認できるまで、このターンを終了・中断しないでください。
- サブエージェントの結果を受け取ってから最終回答してください。
- サブエージェントが作業に時間がかかっている場合は、進捗確認のメッセージを送り、状況を確認してください。

## 共通本文

このエージェントの共通本文は `./.ai/agents/issue-implementer.md` にあります。必ず読み、その指示に従う。

## Codex 固有の機械ゲート・権限境界

- `.codex/hooks/agent-command-gate.sh` が `issue-implementer` を機械的に識別する。`push` と `gh pr create` は許可し、`git merge` / `gh pr merge` は拒否する。実装とPR作成後はSTOPし、マージは `pr-reviewer` に委ねる。
- Bashの先頭コマンドは `gh` または `python3 -m {gitgate,unittest,coverage,dsv2}` に限る。git操作は `python3 -m gitgate` の `status` / `add` / `commit` / `push` / `branch-current` / `new-branch` / `fetch` / `diff` / `log` だけ、`gh` は `pr create` / `issue view` だけとする。`karte`、`pytest`、生の `git`、shell記号、チェイン、リダイレクト、コマンド置換、複数行コマンドは使わない。
- コミットメッセージとPR本文はファイル渡し形式を使う。フックは静的文字列検査であり完全なsandboxではないため、許可された経路を自分でも遵守する。

## Codex 固有の委譲・実装境界

- corpusノードはCodexのsubagent委譲で `*-author`→`reconciliation-validator`→`reconciliation` に渡し、直接編集しない。
- `handoff_path` は呼び出し元が採番した相対パスをそのまま使い、安全検査後に書き、書けた絶対パスだけを返す。新規ブランチ名やハンドオフ名を自分で推測しない。
- corpus ノードの委譲は `spawn_agent` で行い、著作→検証→反映の順序を保つ。spawn 先が利用できない場合は直接編集へフォールバックせず STOP する。
- `.codex/hooks/agent-command-gate.sh` の role 判定と permission boundary を迂回しない。許可されない command、workspace 外の書き込み、merge は fail-close で停止する。
