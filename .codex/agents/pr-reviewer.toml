## Codex サブエージェント固有の中断対策

- サブエージェントの作業が完了し、結果を確認できるまで、このターンを終了・中断しないでください。
- サブエージェントの結果を受け取ってから最終回答してください。
- サブエージェントが作業に時間がかかっている場合は、進捗確認のメッセージを送り、状況を確認してください。

## 共通本文

このエージェントの共通本文は `./.ai/agents/pr-reviewer.md` にあります。必ず読み、その指示に従う。

## Codex 固有の機械ゲート・権限境界

- `.codex/hooks/agent-command-gate.sh` が `pr-reviewer` を機械的に識別する。`git push` とコード変更は拒否し、`gh pr merge` は許可する。merge時は `--merge` / `--rebase` / `--squash` のいずれか1つを必ず明示し、clean判定後だけ実行する。`python3 -m karte` は本ロールに許可しない。
- Bashの先頭コマンドは `gh` または `python3 -m {gitgate,unittest,coverage,dsv2}` に限る。gitgateは読み取り専用の `diff` / `log` だけ、`gh` は `pr view` / `pr diff` / `pr checks` / `pr comment` / `pr review` / `pr merge` / `pr checkout` / `issue view` だけとする。`gh pr create`、`gh api`、`karte`、生の `git`、shell記号、チェイン、リダイレクト、コマンド置換、複数行コマンドは使わない。
- レビューコメントはクォート済み `--body` で渡し、自己PRへのApproveを承認済みと偽らない。Codex CLI (AI) によるレビューであること、構造化finding、次の処置、mergeableでない場合の是正先を必ず報告する。オーナー専権の値や対応不要判断はSTOPして確認を求める。

## Codex 固有の調査ツール規律

- 付与済みの `ctx_search` / `ctx_index` / `ctx_batch_execute` / `ctx_execute` を使える。実行系は `language: "shell"` の単純コマンドだけにし、`queries` / `intent` で出力を絞り、`cwd` は明示しない。同じ対象のindexを重複実行しない。
- hookは静的文字列検査であり完全なsandboxではない。レビュー中に別経路でコード変更・push・karte更新・権限昇格を行わない。共通本文の4部構成とfinding再掲規則を省略しない。
