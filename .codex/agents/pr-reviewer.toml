## Codex 固有の機械ゲート・権限境界

- `.codex/rules/default.rules` の native execpolicy が全ロールの PR merge 系シェルコマンドを拒否する。本ロールの hook allowlist に merge 専用例外は置かない。`git push` とコード変更も拒否し、`python3 -m karte` は本ロールに許可しない。
- `gh api` は REST/GraphQL の request body を含めて fail-close する Codex native rule の対象である。
- Bashの先頭コマンドは `gh` または `python3 -m {gitgate,unittest,coverage,dsv2,asset_parity,time_fixture_lint}` に限る。ただし、保存差分の読取に限り `rtk sed -n <開始>,<終了>p <パス>` を例外として許可する（対象は `tmp/pr-diffs/pr-<PR番号>-<32桁hex>.diff`）。gitgateは読み取り専用の `diff` / `log` / `show-pr-diff` だけ、`gh` は `pr view` / `pr diff` / `pr checks` / `pr comment` / `pr review` / `issue view` だけとする。PR差分取得では常に `rtk gh pr diff <N> --no-compact` を使う。RTKを迂回・無効化しない。`--no-compact` はRTKの正規の完全出力機能である。Codex CLIの差分取得には `python3 -m gitgate show-pr-diff <N>` を使う（内部実行 argv は `rtk gh pr diff <N> --no-compact`）。`asset_parity`/`time_fixture_lint` は `check` サブコマンドのみ（read-only 監査）。`gh pr create`、`gh api`、`karte`、生の `git`、shell記号、チェイン、リダイレクト、コマンド置換、複数行コマンドは使わない。
- ツール出力上限で切り詰められ全文保存先が示された場合は、そのファイルを読んで全文を確認する。プレビューだけでレビュー完了・clean判定をしない。
- 差分全文を取得・確認できなかった場合（出力切り詰め、保存ファイルを末尾まで読めない、または全範囲を確認できない場合を含む）は、未確認範囲を明示した `harm: real` / `severity: blocker` / `scope: in` の finding として自己申告し、判定を STOP にする。未確認範囲が PR 差分全体なら locus は `PR#<N>::diff` とし、一部ファイルだけ未確認ならそのファイルのパスを locus とする。未取得部分を推測で評価したり mergeable と判断したりしない。
- 保存ファイルは実行環境の wrapper が定める読取手段を使い、最初は約 100 行ずつの範囲を 1 行目から末尾まで重複や欠番なく読み進める。出力に切り詰め表示（`truncated output` 等）が出るか、返却行数が要求行数に満たない場合は、その範囲を半分に分けて読み直す。分割後の各範囲でも、切り詰め表示の有無と要求行数・返却行数を同じ方法で照合する。1 行の範囲でも切り詰め表示が出る場合、または保存後にファイルが短くなった等で 1 行の範囲が空出力になる場合に限り、未確認範囲として自己申告し、判定を STOP にする。利用可能なマニフェストの `lines` がある場合は、全範囲の返却行数合計と照合する。SHA-256 は判定条件にしない。
- Codex CLI では保存ファイルを `rtk sed -n <開始>,<終了>p <パス>` で範囲ごとに読み、各範囲の実際に返されたデータ行数を数えて要求範囲の行数（終了行 - 開始行 + 1）と一致することを確認する。
- **allowlist に残っている `python3 -m unittest` / `coverage` は base ブランチしか検証しない**（Issue #502 F-502-05・Claude 版と同一の期待値）。`gh pr checkout` を許可しない以上、PR head の内容は作業ツリーに存在しないため、手元で走らせたテストの結果を「この PR のテストが通った」と報告しない。PR の CI 結果は `gh pr checks` で読む。allowlist に残してあるのは base 側の挙動確認や仮説の再現のためであって、PR の検証手段としてではない。
- **`gh pr checkout` は許可しない**（Issue #502 観測2・Claude 版と同一の期待値）。Codex の `spawn_agent` には isolation が無く、レビューアは呼び出し元とワークツリーを共有したまま動くため、`gh pr checkout` はその作業ツリーのブランチを切り替えてしまう。戻し忘れ・異常終了があると、以後の `gitgate adopt-branch` が `BRANCH_ADOPT_LOCAL_EXISTS` で必ず失敗して是正ループが止まる。差分は `rtk gh pr diff --no-compact` / `gh pr view` / `python3 -m gitgate show-pr-diff|diff|log` で読む。根拠は `.ai/rationale/pr-reviewer.md`。
- レビューコメントはクォート済み `--body` で渡し、自己PRへのApproveを承認済みと偽らない。Codex CLI (AI) によるレビューであること、構造化finding、fresh blocker report の結果、オーナーが手動判断する次の処置を必ず報告する。オーナー専権の値や対応不要判断はSTOPして確認を求める。

## Codex 固有の調査ツール規律

- 付与済みの `ctx_search` / `ctx_index` / `ctx_batch_execute` / `ctx_execute` を使える。実行系は `language: "shell"` の単純コマンドだけにし、`queries` / `intent` で出力を絞り、`cwd` は明示しない。同じ対象のindexを重複実行しない。
- hookは静的文字列検査であり完全なsandboxではない。レビュー中に別経路でコード変更・push・karte更新・権限昇格を行わない。共通本文の4部構成とfinding再掲規則を省略しない。
- `spawn_agent` はレビュー担当の単一責務を分割・代行するために使わない。別担当への引き渡しが必要な場合は finding と次の処置を明記して主文脈へ返す。
- `.codex/hooks/agent-command-gate.sh` の permission boundary を迂回しない。レビュー中の push、コード変更、karte 更新は fail-close で停止する。
