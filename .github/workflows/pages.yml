name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v6

      # Keep the discovery roots and order aligned with tests.yml. Each suite appends
      # coverage data to the same file; any failed step stops the job before Pages deploys.
      - name: Run unit test suite with coverage
        run: uv run --with coverage coverage run -m unittest discover -s tests/unit

      - name: Run time fixture scanner tests with coverage
        run: uv run --with coverage coverage run --append -m unittest discover -s tests/time_fixture_lint

      - name: Run Jev hook test suite with coverage
        run: uv run --with coverage --with-requirements jev_hooks/requirements.txt coverage run --append -m unittest discover -s tests/jev_hooks

      - name: Write coverage summary
        run: uv run --with coverage coverage report -m --skip-covered

      - name: Build coverage HTML
        run: uv run --with coverage coverage html

      - name: Prepare Pages site
        run: mkdir -p _site/coverage

      - name: Build doc-system v2 viewer
        run: python -m dsv2 build-view --root doc-system-v2 --out _site/doc_view.html

      - name: Assemble Pages site
        run: |
          cp -R htmlcov/. _site/coverage/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
