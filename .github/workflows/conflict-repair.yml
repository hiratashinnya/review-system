name: deterministic-conflict-repair

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 対象 PR 番号
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read
  actions: write

jobs:
  repair:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: 単独 PR の生成物を評価
        run: python3 -m conflict_repair
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
