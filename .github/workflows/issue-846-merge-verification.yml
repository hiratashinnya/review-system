name: issue-846-merge-verification
on:
  push:
    branches: [issue-801-review-round-receipts]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry-run-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Identify actual Git merge conflicts without publishing a merge
        run: |
          git fetch origin main
          git config user.name merge-probe
          git config user.email merge-probe@example.invalid
          set +e
          git merge --no-commit --no-ff origin/main
          result=$?
          set -e
          echo "MERGE_PROBE_EXIT=$result"
          echo "MERGE_PROBE_CONFLICTS_BEGIN"
          git diff --name-only --diff-filter=U
          echo "MERGE_PROBE_CONFLICTS_END"
          if [ "$result" -ne 0 ]; then git merge --abort; else git merge --abort || true; fi
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Issue 614 801 523 and CLI compatibility
        run: |
          python3 -m unittest tests.unit.test_karte_issue614 tests.unit.test_karte_issue523_override tests.unit.test_karte_cli_split_compat tests.unit.test_karte_cli_verbs_compat tests.unit.test_karte_model_compat tests.unit.test_karte_ac_reviewer_binding tests.unit.test_karte_ac_finding_verdict tests.unit.test_karte_ac_snapshot_update tests.unit.test_karte_ac_html_comments tests.unit.test_karte_ac_escaped_comment tests.unit.test_karte_ac_multiline_code_span tests.unit.test_karte_ac_owner_write_gate tests.unit.test_karte_ac_round_binding tests.unit.test_karte_ac_owner_github_api tests.unit.test_karte_ac_repository tests.unit.test_karte_review_round_receipts tests.unit.test_karte_review_summary tests.unit.test_codex_zero_finding_e2e
      - name: Quality gates
        run: |
          python3 -m maintainability_lint check
          python3 -m asset_parity check
          python3 -m guidance_sync check
          bash .claude/hooks/check-governance-drift.sh
  full-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Full Python unit test suite
        run: python3 -m unittest discover -s tests/unit
