name: guidance-sync

on:
  push:
    paths:
      - ".ai/guidance/**"
      - ".ai/skills/spec-principles/SKILL.md"
      - "AGENTS.md"
      - ".github/copilot-instructions.md"
      - "guidance_sync/**"
      - ".githooks/**"
      - "tests/unit/test_guidance_sync.py"
      - ".github/workflows/guidance-sync.yml"
  pull_request:
    paths:
      - ".ai/guidance/**"
      - ".ai/skills/spec-principles/SKILL.md"
      - "AGENTS.md"
      - ".github/copilot-instructions.md"
      - "guidance_sync/**"
      - ".githooks/**"
      - "tests/unit/test_guidance_sync.py"
      - ".github/workflows/guidance-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check generated guidance
        run: python3 -m guidance_sync check

      - name: Test guidance sync contracts
        run: python3 -m unittest tests.unit.test_guidance_sync
