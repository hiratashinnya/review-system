name: ci-anomaly-report

# Issue #461: main branch 上の全 workflow の最新完了 run を動的に列挙し、失敗と
# GitHub Actions warning annotation を1つの機械可読 report に集約する。
# workflow 名の allowlist は持たないため、workflow 追加時にも自動で対象になる。
#
# 主 cadence は blocker-snapshot.yml からの workflow_call。blocker snapshot は既に
# 無料の外部 cron から5分間隔で dispatch されるため、通知用に別サービスを増やさない。
# schedule は既存パターン同様に保険であり、GitHub は指定時刻どおりの配信を保証しない。
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  actions: read
  checks: read
  contents: write

concurrency:
  group: ci-anomaly-report
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Collect latest main-branch failures and warnings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m ci_anomaly_report \
            --repository "$GITHUB_REPOSITORY" \
            --branch main \
            --output "$RUNNER_TEMP/report.json"

      - name: Publish to the orphan branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan "ci-anomaly-report"
          cp "$RUNNER_TEMP/report.json" report.json
          git add report.json
          git commit --quiet -m "chore(ci-anomaly-report): refresh CI anomaly report

          Generated by GitHub Actions (.github/workflows/ci-anomaly-report.yml) for
          issue #461. This orphan branch is force-pushed as one commit and is never merged."
          git push --force origin "ci-anomaly-report"
