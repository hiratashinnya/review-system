name: defect-metrics

# Issue #488: 欠陥混入率（派生 Issue/PR）の指標を週次で算出し、孤立ブランチ
# `defect-metrics` の `report.json` へ publish する。指標の定義は散文ではなく
# `defect_metrics/` のコードに固定してある（Issue #368 の再現不能の再発防止）。
#
# 孤立ブランチである理由（`.github/workflows/blocker-snapshot.yml` と同じ方式・
# Issue #488「提案挙動」2.）: 既定ブランチへ commit すると main の履歴が計測結果で
# 進み、`git log` が読めなくなる。`--orphan` は main と履歴を共有しないので、main への
# マージも main からのマージも一切不要。さらに毎回 **単一 commit を force-push** する
# ため履歴も増えず、読む側の fetch は常に 1 commit 分で済む。
#
# 主たる起動元は外部 cron（Issue #363 の実測・オーナー確定 2026-08-12）: GitHub の
# `schedule:` は指定間隔での発火を保証しない（#363 の実測では `*/5` でも 74〜104 分
# 間隔でしか発火しなかった）。したがって下の `schedule:` は**保険**であり、主たる
# 起動元は外部 cron サービス（cron-job.org）からの `workflow_dispatch` である。
# 頻度は週次とする——本指標は日単位では動かず、窓幅も既定7日であるため。
# 外部 cron の実設定と初回到達の確認は本 Issue のスコープ外で **#489** が担う
# （手順の正本＝docs/methods/defect-metrics-external-cron-ops.md）。
#
# 課金（`.claude/rules/03-operational.md`「CI/外部サービス連携のコスト方針」）:
# 本 repository は public であり GitHub Actions は無課金・無制限（無料枠の上限自体が
# 存在しない）。ジョブは週1回・数十秒で、`gh issue list` / `gh pr list` の2リクエスト
# 相当しか消費しない（GITHUB_TOKEN の 1,000 requests/h 枠に対し無視できる）。
# 外部 cron（cron-job.org）も無料枠で完結する（公式トップページに「from
# minute-by-minute to once in a year. Absolutely free.」と明記）。したがって本構成は
# 全経路が無課金であり、オーナーの課金認可を要しない。
#
# 既知の劣化条件（いずれも安全側＝「気づける方向」へ倒れる）:
#   - 外部 cron 停止・PAT 失効(401) → `schedule` の保険頻度でしか更新されなくなる。
#     report.json の `generated_at` が古くなるので、読む側は鮮度で気づける。
#   - public repository の scheduled workflow は 60 日間の無活動で自動停止する
#     → 同上。ただし `workflow_dispatch` 起動はこの 60 日ルールの対象外（GitHub 仕様）。
#   - `gh` の出力スキーマ変更・取得失敗 → generator が exit 1 で止まり publish しない
#     （壊れたレポートを配らない fail-close）。job は赤くなる。
#   - 閾値超過（exit 20）は **generator の失敗ではなく計測結果**である。publish は
#     必ず行い、その後で `::warning` を出して可視化する（blocker-snapshot.yml が
#     degraded snapshot を publish してから job を失敗させるのと同じ順序）。
on:
  # 保険のみ（主たる起動元ではない・上記コメント参照）。毎週月曜 03:17 UTC。
  # 分をずらしているのは、毎時 0 分に集中する GitHub 側の scheduled workflow の
  # 混雑を避けるため（公式ドキュメントの推奨）。
  schedule:
    - cron: "17 3 * * 1"
  # 主たる起動元。外部 cron（cron-job.org）が週次でこの workflow_dispatch を叩く
  # （body `{"ref":"main"}`）。設定手順は
  # docs/methods/defect-metrics-external-cron-ops.md を正本とする。
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: defect-metrics
  # 週次で重ならないため cancel は不要。取りこぼしを作らない側に倒す。
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compute the defect-rate report
        id: compute
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          status=0
          python3 -m defect_metrics report \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/report.json" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # exit 20 = 閾値判定が「異常」。レポート自体は完成しているので publish する。
          if [ "$status" -ne 0 ] && [ "$status" -ne 20 ]; then
            echo "::error::defect metrics computation failed (exit ${status}); nothing to publish"
            exit "$status"
          fi

      - name: Verify that the recorded baseline is still reproducible
        # 指標定義（コード）と記録済み基線（Issue #488「現状と根拠」）が食い違ったら
        # 気づけるようにする。過去の窓に対する測定なので、通常は永久に同じ値を返す。
        # 値が動いたら「定義を変えた」か「過去の Issue/PR 本文を編集した」のどちらかで、
        # どちらも人が確認すべき事象である。publish は止めない（警告に留める）。
        id: baseline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m defect_metrics verify-baseline --repository "$GITHUB_REPOSITORY"

      - name: Publish to the orphan branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # --orphan は tracked file を作業ツリーから外し index を空にする。
          # 以降 index には report.json しか入らないので、commit も1ファイルだけ。
          git switch --orphan "defect-metrics"
          cp "$RUNNER_TEMP/report.json" report.json
          git add report.json
          git commit --quiet -m "chore(defect-metrics): refresh defect-rate report

          Generated by GitHub Actions (.github/workflows/defect-metrics.yml) for
          issue #488. This branch shares no history with the default branch and is
          force-pushed as a single commit every run; it is never merged."
          git push --force origin "defect-metrics"

      - name: Annotate when the published report is anomalous
        if: steps.compute.outputs.status == '20'
        run: |
          echo "::warning::defect-metrics report is anomalous (baseline 0.68 exceeded and/or 50%+ regression vs the trailing 4 weeks). The report was published to the 'defect-metrics' orphan branch; see report.json threshold.alerts for the reason."

      - name: Annotate when the recorded baseline no longer reproduces
        if: steps.baseline.outcome == 'failure'
        run: |
          echo "::warning::defect-metrics baseline window (2026-08-02..2026-08-16) no longer reproduces the values recorded in issue #488. Either the metric definition changed or the underlying issue/PR bodies were edited; both need a human decision. See the step log for the mismatch list."
