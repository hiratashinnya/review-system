name: conflict-repair-verification

on:
  workflow_dispatch:
    inputs:
      head_oid:
        description: 修復後の commit OID
        required: true
        type: string

permissions: {}

jobs:
  verify:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Validate commit OID
        env:
          HEAD_OID: ${{ inputs.head_oid }}
        run: '[[ "$HEAD_OID" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_oid }}
          persist-credentials: false
      - name: Confirm checked-out OID
        env:
          HEAD_OID: ${{ inputs.head_oid }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_OID"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: python3 -m unittest discover tests
      - run: python3 -m guidance_sync check

  report:
    needs: verify
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      checks: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish verification result for the tested OID
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_OID: ${{ inputs.head_oid }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          [[ "$HEAD_OID" =~ ^[0-9a-f]{40}$ ]]
          conclusion=failure
          if [[ "$VERIFY_RESULT" == success ]]; then conclusion=success; fi
          payload=$(jq -n --arg sha "$HEAD_OID" --arg conclusion "$conclusion" \
            --arg url "$SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID" \
            '{name:"conflict-repair-verification", head_sha:$sha, status:"completed", conclusion:$conclusion, details_url:$url, output:{title:"Conflict repair verification", summary:"unittest and guidance_sync; required checks are not assessed."}}')
          response=$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_URL/repos/$REPOSITORY/check-runs" -d "$payload")
          jq -e --arg sha "$HEAD_OID" --arg result "$conclusion" \
            '.head_sha == $sha and .conclusion == $result' <<< "$response" >/dev/null
          echo "Verification check published for $HEAD_OID ($conclusion). Required checks remain unconfirmed." >> "$GITHUB_STEP_SUMMARY"
