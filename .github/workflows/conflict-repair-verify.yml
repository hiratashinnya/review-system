name: conflict-repair-verification

on:
  workflow_dispatch:
    inputs:
      head_oid:
        description: 修復後の commit OID
        required: true
        type: string

permissions: {}

jobs:
  verify:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Validate commit OID
        env:
          HEAD_OID: ${{ inputs.head_oid }}
        run: '[[ "$HEAD_OID" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_oid }}
          persist-credentials: false
      - name: Confirm checked-out OID
        env:
          HEAD_OID: ${{ inputs.head_oid }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_OID"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: python3 -m unittest discover tests
      - run: python3 -m guidance_sync check

  report:
    needs: verify
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      checks: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish verification result for the tested OID
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_OID: ${{ inputs.head_oid }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          API_URL: ${{ github.api_url }}
        run: python3 -m conflict_repair.verification_check
