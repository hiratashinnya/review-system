name: conflict-repair-verification

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 対象 PR 番号
        required: true
        type: string
      head_oid:
        description: 修復後の commit OID
        required: true
        type: string

permissions: {}

jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      oids: ${{ steps.resolve.outputs.oids }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: resolve
        name: Resolve live PR and test merge
        run: python3 -m conflict_repair.verification_target
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_OID: ${{ inputs.head_oid }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TRUSTED_SHA: ${{ github.sha }}

  verify-unittest:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        oid: ${{ fromJSON(needs.prepare.outputs.oids) }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Validate commit OID
        env:
          HEAD_OID: ${{ matrix.oid }}
        run: '[[ "$HEAD_OID" =~ ^[0-9a-f]{40}$ ]]'
      - name: Save trusted tests workflow
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Save trusted workflow for comparison
        run: |
          python3 -m unittest tests.conflict_repair.test_verification_check.VerificationCheckTests.test_verification_commands_match_pr_jobs
          cp .github/workflows/tests.yml "$RUNNER_TEMP/trusted-tests.yml"
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.oid }}
          persist-credentials: false
      - name: Confirm checked-out OID
        env:
          HEAD_OID: ${{ matrix.oid }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_OID"
      - name: Require unchanged tests workflow
        run: cmp "$RUNNER_TEMP/trusted-tests.yml" .github/workflows/tests.yml
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run Python test suite
        run: python3 -m unittest discover tests

      - name: Issue 655 codex source regression suite
        run: python3 -m unittest discover -s tests/codex_worktree_exec

      - name: Issue 655 readonly preparation regression suite
        run: python3 -m unittest discover -s tests/issue_start

      - name: Model family policy references and stopped templates
        run: python3 -m model_policy check

      - name: Run time fixture scanner canary tests (Issue #572)
        run: python3 -m unittest discover -s tests/time_fixture_lint

      - name: Install pinned optional Jev SDK for local HTTP mock tests
        run: python3 -m pip install -r jev_hooks/requirements.txt

      - name: Run Jev hook test suite (Issue #572, no live API)
        run: python3 -m unittest discover -s tests/jev_hooks

      - name: Time-dependent test data check (手当てB, issue #344)
        run: python3 -m time_fixture_lint check

      - name: Maintainability principles check (Issue #539)
        run: python3 -m maintainability_lint check

      - name: Guidance sync check
        run: python3 -m guidance_sync check

  verify-typecheck:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        oid: ${{ fromJSON(needs.prepare.outputs.oids) }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Validate commit OID
        env:
          HEAD_OID: ${{ matrix.oid }}
        run: '[[ "$HEAD_OID" =~ ^[0-9a-f]{40}$ ]]'
      - name: Save trusted tests workflow
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Save trusted workflow for comparison
        run: |
          python3 -m unittest tests.conflict_repair.test_verification_check.VerificationCheckTests.test_verification_commands_match_pr_jobs
          cp .github/workflows/tests.yml "$RUNNER_TEMP/trusted-tests.yml"
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.oid }}
          persist-credentials: false
      - name: Confirm checked-out OID
        env:
          HEAD_OID: ${{ matrix.oid }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_OID"
      - name: Require unchanged tests workflow
        run: cmp "$RUNNER_TEMP/trusted-tests.yml" .github/workflows/tests.yml
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install pyright
        # F-510-10: バージョン固定（npm install -g pyright のみだと最新版が無言で入り、
        # リポジトリ側の変更ゼロでも pyright の新版が診断を追加/変更した瞬間に merge を左右する
        # fail-close ゲートの判定基準が実行日依存になる）。更新は意図的な変更としてこの行を
        # 編集する PR に載せる。
        run: npm install -g pyright@1.1.390

      - name: Type-check declared files (Issue #510, fail-close on the declared list only)
        run: |
          set -e
          mapfile -t files < <(grep -vE '^[[:space:]]*(#|$)' .github/typechecked-files.txt)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no files declared in .github/typechecked-files.txt" >&2
            exit 1
          fi
          echo "Type-checking (fail-close): ${files[*]}"
          pyright "${files[@]}"

  report:
    needs: [prepare, verify-unittest, verify-typecheck]
    if: always() && needs.prepare.result == 'success' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      checks: write
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Revalidate live PR and test merge
        run: python3 -m conflict_repair.verification_target
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_OID: ${{ inputs.head_oid }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TRUSTED_SHA: ${{ github.sha }}
          EXPECTED_TARGET: ${{ needs.prepare.outputs.target }}
      - name: Publish verification results for both tested OIDs
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_OID: ${{ inputs.head_oid }}
          MERGE_OID: ${{ fromJSON(needs.prepare.outputs.target).merge_oid }}
          UNITTEST_RESULT: ${{ needs.verify-unittest.result }}
          TYPECHECK_RESULT: ${{ needs.verify-typecheck.result }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          API_URL: ${{ github.api_url }}
        run: python3 -m conflict_repair.verification_check
