name: issue-801-temporary-verify
on:
  push:
    branches: [issue-801-review-round-receipts]
  workflow_dispatch:

permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: F-801 Codex finding and adjacent integration regressions
        run: |
          python3 -m unittest tests.unit.test_karte_review_summary tests.unit.test_karte_ac_reviewer_binding tests.unit.test_karte_ac_finding_verdict tests.unit.test_karte_reviewer_ingest tests.unit.test_codex_zero_finding_e2e tests.unit.test_codex_ac_snapshot_input
      - name: SSoT and maintainability gates without baseline edits
        run: |
          python3 -m maintainability_lint check
          python3 -m asset_parity check
          python3 -m guidance_sync check
  full-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Full unittest discovery
        run: python3 -m unittest discover tests
      - name: Issue-start and codex source suites
        run: |
          python3 -m unittest discover -s tests/codex_worktree_exec
          python3 -m unittest discover -s tests/issue_start
      - name: Lints and model family policy
        run: |
          python3 -m model_policy check
          python3 -m time_fixture_lint check
