name: issue-801-temporary-verify
on:
  push:
    branches: [issue-801-review-round-receipts]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Test outstanding review findings F-801-06 and F-801-08 with adjacent regressions
        run: |
          python3 -m unittest             tests.unit.test_karte_ac_snapshot_update             tests.unit.test_karte_ac_reviewer_binding             tests.unit.test_codex_ac_snapshot_input             tests.unit.test_karte_reviewer_ingest             tests.unit.test_codex_worktree_exec_review_handoff             tests.unit.test_karte_cli_verbs_compat             tests.unit.test_karte_owner_reviewer_registration             tests.unit.test_review_harm_launch
      - name: Verify repository contracts
        run: |
          python3 -m guidance_sync check
          python3 -m asset_parity check
          python3 -m maintainability_lint check
