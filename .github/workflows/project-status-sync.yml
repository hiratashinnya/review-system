name: project-status-sync

# Issue #460: GitHub Project「review-system Development」の `Status` を、
# blocker-snapshot.yml が publish 済みの `snapshot.json` から同期する。
# `Blocked` を設定する経路が built-in workflow に存在せず、「gate は着手を
# fail-close で拒否するのにボードは Ready のまま」という食い違いが常時起こりうる
# 状態を解消する。
#
# blocker-snapshot.yml に相乗りさせない理由（Issue #460 Scope §2）:
# 同ワークフローは issue-start gate に食わせる fail-close の生命線であり、
# `concurrency.cancel-in-progress: true` が付いている。Project 書き込みを足すと
# (a) runner のキュー待ちが外部 cron 間隔を超えたときに書き込み途中で run が
# cancel され Project が中途半端に残る、(b) Project 書き込みの失敗が gate 用
# snapshot の publish を巻き込む——という形で gate 本体の信頼性を下げる。
# 障害ドメイン・cadence・PAT スコープを独立させる。
#
# cadence: gate の5分は「拒否判定の鮮度」に効くための頻度であり、ボード表示に
# 同じ厳しさは要らない。cron を有効化するときは20分間隔とし、ツール側の鮮度上限
# （60分）が blocker-snapshot の停止だけを捕まえるようにする（本 PR では cron を
# 入れていない。理由は下の `on:` のコメント）。
#
# `pull_request_target` は使わない（public repository で secret が露出する経路を
# 作らないため）。secret `PROJECT_SYNC_TOKEN` は classic PAT（scope は `project`
# のみ・`repo`/`workflow` は付けない）。Actions の GITHUB_TOKEN では Projects V2 に
# 書き込めない（`permissions:` の `repository-projects` は旧 classic projects 用）。
#
# 課金（CLAUDE.md「CI/外部サービス連携のコスト方針」）: 本 repository は public で
# あり GitHub Actions は無課金・無制限。PAT も無料。追加コストは発生しない。
#
# 可視化: blocker-snapshot.yml と同じく **publish してから赤くする**。
# report.json を孤立ブランチへ force-push した後で `::error` を出して job を
# 失敗させる。逆にするとレポートが残らないまま落ちる（Issue #345 F-345-03 と同型）。
#
# 初回運用は human-in-the-loop（PR #465 F-460-01・オーナー確定 2026-09-03）:
# 本 PR では `on:` に `schedule` を**入れない**。cron の有効化は後続 PR で行う。
# 理由: `workflow_dispatch.inputs.apply` を足すだけでは、merge から20分以内に cron が
# `--apply` で発火してしまい、「まず dry-run で変更計画を確認する」という初回確認が
# 20分タイマーとの競争になって実質的に成立しない。Project には書き込みの復元手段が
# 無い（project_status_sync/README.md「使い方」）ため、確認を先に成立させる。
# 運用: merge 後にオーナーが `workflow_dispatch`（`apply: false`）で dry-run し、
# `$GITHUB_STEP_SUMMARY` の変更計画を確認してから常用（cron）に入る。
# cron を有効化する後続 PR での注意: `schedule` 発火時は `inputs` が存在せず
# `inputs.apply` が空文字になるので、schedule 時に `--apply` を付けるかどうかを
# その PR で明示的に決めること（下の `APPLY` の既定は dry-run 側に倒してある）。
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Project へ実際に書き込む（false = dry-run。変更計画を run summary に出すだけ）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: project-status-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch the published blocker snapshot
        run: |
          set -euo pipefail
          git fetch --no-tags --depth 1 origin "+refs/heads/blocker-snapshot:refs/remotes/origin/blocker-snapshot"
          git show "origin/blocker-snapshot:snapshot.json" > "$RUNNER_TEMP/snapshot.json"

      - name: Sync Project Status
        id: sync
        env:
          PROJECT_SYNC_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          # `inputs` は workflow_dispatch でのみ存在する。それ以外の trigger では
          # 空文字になるので、下の既定値で dry-run 側（--apply なし）へ倒れる。
          APPLY: ${{ inputs.apply }}
        run: |
          set -uo pipefail
          # CLI の既定は dry-run。`--apply` は入力が明示的に true のときだけ付ける。
          apply_args=()
          if [ "${APPLY:-false}" = "true" ]; then
            apply_args+=(--apply)
          fi
          status=0
          python3 -m project_status_sync sync \
            --repository "$GITHUB_REPOSITORY" \
            --project-id "PVT_kwHOBPTOrM4BezS3" \
            --project-number 1 \
            --snapshot "$RUNNER_TEMP/snapshot.json" \
            --report "$RUNNER_TEMP/report.json" \
            "${apply_args[@]}" >> "$GITHUB_STEP_SUMMARY" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # exit 20 = 中断または警告。report.json は書けているので publish して
          # から赤くする。それ以外の非 0 は report が無いので即座に落とす。
          if [ "$status" -ne 0 ] && [ "$status" -ne 20 ]; then
            echo "::error::project-status-sync aborted (exit ${status}); nothing to publish"
            exit "$status"
          fi

      - name: Publish the report to the orphan branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # --orphan は tracked file を作業ツリーから外し index を空にする。
          # 以降 index には report.json しか入らないので commit も1ファイルだけ。
          git switch --orphan "project-status-sync-report"
          cp "$RUNNER_TEMP/report.json" report.json
          git add report.json
          git commit --quiet -m "chore(project-status-sync): refresh project status sync report

          Generated by GitHub Actions (.github/workflows/project-status-sync.yml) for
          issue #460. This branch shares no history with the default branch and is
          force-pushed as a single commit every run; it is never merged."
          git push --force origin "project-status-sync-report"

      # publish 済みの report を可視化する。ここで初めて job を失敗させるので、
      # 中断・警告はレポートが配布された上で赤く残る。
      - name: Fail the job when the sync reported a problem
        if: steps.sync.outputs.status == '20'
        run: |
          echo "::error::project-status-sync reported an abort or a warning. The report was published to the 'project-status-sync-report' branch and the run summary above lists the details. Skipped items (NOT_IN_SNAPSHOT / STATUS_UNSET / STATUS_UNKNOWN) never cause this failure."
          exit 1
