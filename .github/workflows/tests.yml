name: tests

# Issue #344 (手当てA): a `pull_request`-triggered CI workflow that runs the full unit
# test suite as a PR status check. Before this, only `pages.yml` (push:main only) and
# `asset-parity.yml` (path-filtered, and never runs unittest at all) existed — a red PR
# could merge into `main` undetected (see #339: PR #335 merged commit 575680f, which
# broke `main`, without ever running a test on the PR itself).
#
# Relationship to pages.yml (separate workflows; rationale recorded per this issue's AC
# "重複実行・役割分担について判断根拠"):
#   - pages.yml builds the coverage report, HTML, and Pages artifact on pull requests and
#     deploys only after a main push or a manual dispatch targeting main. Its build runs
#     the three suites with coverage because the report consumes their combined data.
#   - This workflow remains the PR status gate. It runs the same suites without coverage,
#     plus repository-specific checks, and requests only contents: read. The Pages build
#     also runs on PRs so its distinct coverage/report/artifact path is verified before
#     merge; the unit suites therefore intentionally run in both workflows on PRs.
#   - Keeping the jobs separate preserves distinct status checks and keeps Pages write
#     and OIDC permissions confined to the conditional deployment job. A reusable test
#     job would not remove the coverage-specific report build and would couple the
#     independently rerunnable PR gate to deployment workflow changes.
#   - A main push runs the Pages build and deployment. A pull_request runs both the
#     ordinary PR gate here and the Pages artifact build, without deploying. A manual
#     dispatch can build any selected ref, but deploys only when the selected ref is main.
#
# Cost (AC: "課金を発生させない構成であることが根拠付きで記録されている"): this repository is
# public, so GitHub Actions usage is unmetered. PRs run the three test suites twice
# (once bare here and once under coverage for the Pages artifact), in addition to the
# separate Pages report and artifact steps.
#
# `typecheck` job (Issue #510): a second, independent job that runs `pyright` against only
# the files declared in `.github/typechecked-files.txt` and fails the build if any of them
# regresses. It is a separate job (not a step in `unittest`) so a pyright failure and a
# unittest failure are reported as distinct, independently-rerunnable checks. Scope is
# intentionally narrow — see `.github/typechecked-files.txt`'s header comment for why the
# whole repository is not gated. Same cost story as above: public repo, GitHub Actions
# unmetered, `npm install -g pyright` adds a fixed, small amount of job time.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run Python test suite
        run: python3 -m unittest discover tests

      - name: Model family policy references and stopped templates
        run: python3 -m model_policy check

      - name: Run time fixture scanner canary tests (Issue #572)
        run: python3 -m unittest discover -s tests/time_fixture_lint

      - name: Install pinned optional Jev SDK for local HTTP mock tests
        run: python3 -m pip install -r jev_hooks/requirements.txt

      - name: Run Jev hook test suite (Issue #572, no live API)
        run: python3 -m unittest discover -s tests/jev_hooks

      - name: Time-dependent test data check (手当てB, issue #344)
        run: python3 -m time_fixture_lint check

      - name: Maintainability principles check (Issue #539)
        run: python3 -m maintainability_lint check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install pyright
        # F-510-10: バージョン固定（npm install -g pyright のみだと最新版が無言で入り、
        # リポジトリ側の変更ゼロでも pyright の新版が診断を追加/変更した瞬間に merge を左右する
        # fail-close ゲートの判定基準が実行日依存になる）。更新は意図的な変更としてこの行を
        # 編集する PR に載せる。
        run: npm install -g pyright@1.1.390

      - name: Type-check declared files (Issue #510, fail-close on the declared list only)
        run: |
          set -e
          mapfile -t files < <(grep -vE '^[[:space:]]*(#|$)' .github/typechecked-files.txt)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no files declared in .github/typechecked-files.txt" >&2
            exit 1
          fi
          echo "Type-checking (fail-close): ${files[*]}"
          pyright "${files[@]}"

  feedback-ledger:
    # Issue #522: `.ai/feedback/` の機械 lint。`typecheck` と同じ理由で独立ジョブにする
    # （lint 失敗と unittest 失敗を別々の再実行可能なチェックとして出す）。
    #
    # `fetch-depth: 0` が要る理由: L6（immutability＝merge base に在る台帳エントリの
    # バイト変更・削除の拒否）と P1（改訂案の状態遷移）は **merge base との比較**で判定する。
    # 既定の shallow clone（depth=1）では base を解決できず、両規則が WARN で skip されて
    # 「検査したつもりで何も見ていない」状態になる。
    #
    # `--require-base` が要る理由（F-522-02）: 上の `fetch-depth: 0` は**設定でしかなく**、
    # 外れても WARN が1行増えるだけで CI は緑のままだった（ERROR 閾値でしか落ちないため）。
    # つまり「台帳の改ざん検知と状態遷移検査が無言で無効化される」経路が設定1行の欠落で
    # 開く。`--require-base` を付けると base 未解決そのものが ERROR になり、終了コード4で
    # ここが落ちる＝**検査できなかったことがビルドを止める**。ローカル実行の既定は WARN の
    # ままなので、git の無い環境や shallow clone で必ず落ちる問題は起こらない。
    #
    # **CI が落とすのは ERROR 閾値だけ**（`check` の終了コードは errors>0 のときだけ 4）。
    # 滞留の WARN はここでは落とさない——毎 PR で鳴るゲートは形骸化するため、滞留の督促は
    # I3（週次棚卸しのフック）側に置く。
    #
    # コスト: このリポジトリは public のため GitHub Actions は完全に無課金（従量課金は
    # private リポジトリの無料枠超過分だけ）。追加ジョブは標準ライブラリだけで数秒で終わる。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Feedback ledger lint (Issue #522, fail-close on ERROR only)
        run: python3 -m feedback_ledger check --canonical --require-base
