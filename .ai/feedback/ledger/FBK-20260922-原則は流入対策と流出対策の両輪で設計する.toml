AI がこのセッション全体で行ってきた点検は、ゲート・フック・テスト・lint の点検、すなわち**ほぼ全てが
流出対策**だった。C-2 の目玉所見「不変条件型 > 列挙型」ですら、検出方式2つの比較にすぎず、
「その不具合をそもそも書けなくできたか」は一度も問うていなかった。

判断内容（移行元）:
> **④の徹底機構は、流入対策（不具合をそもそも書けなくする）と流出対策（書かれた不具合を捕まえる）の
> 両輪で設計する。流出対策（テスト・ゲート）は当然の前提であり、それだけで十分とはしない。**
> 流入対策を優先する。

以前の案・判断の経緯（承認決定とみなさない）: FBK-20260922-④は保守性中心の11原則で足りる
> SOLID・DRY・YAGNI・SSoT・不変条件型検証・fail-safe defaults・最小権限・テスト容易性の11項目で
> ④の原則セットとして十分。
**2つの理由で不十分だった。** (1) ほぼ全てが流出対策（検出）に属し、流入対策（そもそも不具合を
書けなくする）が抜けていた——C-2 の目玉所見「不変条件型 > 列挙型」ですら検出方式2つの比較に
すぎない。(2) ISO 25010 の8品質特性で照合すると、まともに被覆していたのは保守性1つだけで、
機能適合性・信頼性・セキュリティが欠けていた。
