background = '''
AI が「Q の下限をどこに置くか」を判断事項として提示し、**現在値 0.37 を下限とする案を推奨した**
（既に改善した水準を手放す施策を許さないため、という理由）。オーナーがこれを退け、転用先の
要求水準から 1% を提示した。

判断内容（移行元）:
> **流出欠陥率 1%（0.01）。**

点検時点の実測値は **0.37**（`defect_metrics` の派生 Issue / merged PR）。**下限に対して約37倍、未達。**

| | 値 |
|---|---|
| 下限（ECU 転用要件） | **0.01** |
| 現在値（直近窓） | **0.37** |
| 基線（2026-08-02〜08-16） | 0.68 |
| 必要な削減幅 | **97.3% 減** |

**トレンドの外挿では届かない**——5週間で 0.68 → 0.37（46%減）。同率が続くと仮定しても 0.01 到達は
約29週間後。かつこの仮定は二重に甘い：(a) 46%減の因果が特定できていない（#370 本文が明記）、
(b) 同期間にコストは逆方向に増えている（規範 86k 文字・ゲート14本・台帳6つ）。

以前の案・判断の経緯（承認決定とみなさない）: FBK-20260921-qの下限は現在値0.37とする
> Q の下限は現在値 0.37（`defect_metrics` の派生 Issue / merged PR）とし、これを悪化させない。
> 基線 0.68 ではなく現在値を採るのは、既に改善した水準を手放す施策を許さないため。
転用先（車載 ECU）の要求水準を見ていない提案だった。**「現在の実力から出発する」という発想自体が、
制約（Q の下限は外部要件で決まる）と目的関数（C/D の最小化）を取り違えている。**
[QCDはQを制約としCとDを最小化する](#fbk-20260921-qcdはqを制約としcとdを最小化する) で「Q は制約である」と定式化した直後に、その制約を内部の実績から決めようとしていた。
'''
