[narrative]
background = '''
PR #571 は、キーが無いとき・確信度が低いときのどちらも黙って通す実装だった（`docs/jev-hook-review.md`
で「実装時の通常判断」とされていた）。Claude Code (AI) は「確信度が低い判定はオーナーへ上げる経路を作る・
キー無しは通して警告」を推奨したが、「確信度が低い」という書き方が不正確だった。オーナーから「止める
確信度が低いということは、止めない確信度が高いということではないのか」と問われた。

AI の説明：二択で一方の確率が低ければ他方は高い、という推論は、判定が片側へ十分寄っている場合
（例：説明不足 0.1／足りている 0.9）には正しく、その場合は通してよい。問題はどちらにも寄らない中間帯
（例：0.55／0.45）である。さらに PR の問いは「はい／いいえ／分からない」の三択で、答えには確率とは別に
「その答え自体をどこまで信用できるか」の値（confidence）が付く（§E の調査記載。厳密な定義は公式資料で
未確認）。PR は「分からない」または confidence が閾値未満の答えを採用せず、結果として通す側に倒していた。
論点は「言い切れない判定をどう扱うか」であり、通す／止める／知らせるの3案を提示した。

判断内容（移行元）:
> - **API キーが無いときは止める（fail-close）。** 対象は `evaluator: "jev"` の場合のみで、mock には影響しない。
>   shadow では拒否を出さず、障害として記録する。
> - **違反とも非違反とも言い切れない判定（「分からない」、または confidence が閾値未満）は、作業を止めずに
>   記録してオーナーへ知らせる。** 黙って通すことも、止めることもしない。通知が多すぎる場合は閾値を見直す。
> - 違反・非違反のどちらかへ十分に寄った判定は、従来どおり止める／通す。
'''
