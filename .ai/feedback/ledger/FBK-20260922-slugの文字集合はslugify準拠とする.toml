[narrative]
background = '''
`SLUG` が ASCII 限定のため、日本語トピックをそのまま id にできなかった。一方 `slugify.py` は
「ASCII は小文字化（日本語はそのまま）」と定めており、doc-system-v2 のノード群は既に日本語
ファイル名で運用実績を持つ（`doc-system-v2/nodes/04-verification/dd/decided/` 配下）。

`%` については、URL のパーセントエンコード導入子であるため markdown アンカーで誤読される理屈上の
リスクを AI が申告した（`Qの下限は流出欠陥率1%とする`）。**`feedback_ledger` 側に専用の敵性文字を
足すことは、正規化規則の分岐実装を作ることであり、`slugify.py` の「独自再実装を禁じる」に反する。**
実害が出たら `slugify.py` 側を直して両方に効かせる。

なお markdown リンクの fragment 内では `%` を `%25` としてエスケープする（アンカー本体は `%` のまま）。
これは URL の書き方の問題であって、slug の文字集合の話ではない。

判断内容（移行元）:
> **`slugify.py` の出力をそのまま id にする。`feedback_ledger` 専用の文字規則を足さない。**
>
> - **日本語を許す。** 現行の `SLUG = r"[a-z0-9]+(?:-[a-z0-9]+)*"` を拡張する。
> - **`%` と `.` を slug に残す。** `slugify.py` はこの2文字を敵性文字としていないので、そのまま通す。
'''
