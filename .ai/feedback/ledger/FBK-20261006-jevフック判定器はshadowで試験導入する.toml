[narrative]
background = '''
PR #571 のレビューで、Claude Code (AI) が「§E は Jev 採用を未決としているのに、採用判断・施策登録・観測窓の
記録が無いまま実装が進んでいる」と指摘した。AI は当初「試験採用し、観測窓は結線時に開く」を推奨したが、
オーナーから「shadow から結線に移る契機は？」と問われた。AI は自分の書き方の誤りを訂正した——
**shadow で動かすには結線（settings.json への登録）がそれ自体必要**であり、正しくは「結線なし→結線＋shadow→
結線＋enforce」の3段階で、観測窓を開くべきは enforce 開始時である。その上で移行契機を3案
（定量基準／期間／オーナー都度判断）で提示した。

判断内容（移行元）:
> PR #571 の Jev フック判定器（R1〜R4）を**試験導入する**。次の3段階で進める。
>
> | 段階 | 状態 | 作業への影響 |
> |---|---|---|
> | 0 | 結線なし（PR #571 の時点） | なし |
> | 1 | 結線＋shadow。判定を記録するだけ | なし（拒否しない） |
> | 2 | 結線＋enforce。実際に止める | あり |
>
> - **観測窓は段階2（enforce）の開始時に開く。** 段階1は作業の挙動を変えないため、施策の効果ではなく
>   判定器の正しさを確かめる期間とする。
> - **段階1→2の移行は定量基準で、ルール（R1〜R4）ごとに行う**：「止めたはず」の記録をオーナーが
>   **30件**確認し、誤った拒否が **5%以下**に収まったルールから順に enforce にする（数値は暫定）。
> - 移行判断の前提として、shadow の判定記録をリポジトリから参照できる形にする必要がある
>   （PR #571 は `~/.local/state` の SQLite に置いており、§C-2「曝露量で割れない」と同じ欠陥を持つ。処置先は未決）。
> - §E-2（J-8〜J-11）は引き続き AI の提案・未決であり、本決定の対象外。
'''
