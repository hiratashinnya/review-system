フラクタル原則自身が防ごうとした「AC後付け確証バイアス」（#371自身が問題視した構造）が
形を変えて残っていた。

(b) 1b行の `plan-reviewer` が「risk gate 該当時」の条件付きだった一方、
[AC妥当性確認はplan-reviewerを強化して担う](#fbk-20260922-ac妥当性確認はplan-reviewerを強化して担う)
