**2つの誤りが残っていた。** (a) 1a（アーキ設計＝結合検査レベル）と 2a（実装＝単体検査レベル）という
**異なる検査レベル**を「TD→TC→TR」という1本の鎖に畳んでいた——review_system 既存 `test-strategy` の
実際の ID 規則（`TD-<area>-<nnn>`）には検査レベルの区別が元から無く、それをそのまま踏襲してしまった。
(b) 別コンテキストの別 dispatch であるはずの 1a と 1b が、`ChangePlan` という**同じオブジェクトを
co-edit** する設計になっていた——`.claude/rules/05-skills-agents.md`「戻り値のハンドオフ規約」
（呼び出し先が新規に書き、呼び出し元が回収する）と整合しない。

