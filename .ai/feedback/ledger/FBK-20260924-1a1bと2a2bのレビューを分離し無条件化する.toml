上記のうち IT 水準の review_system 側実装状況（形式的には無いが `test_apply.py` 等一部が実質的に
結合レベルを含む・#543 起票済み）と、各行の受け渡し方式（`gitgate new-branch`→`adopt-branch` 連鎖）は
本訂正の対象外で、そのまま v5（現行§A）へ引き継がれている。

**本エントリ（v4）自身の成立過程**（役割矛盾の是正→TD-TC-TR重複の解消→検査レベルの分離・
`VerificationDesign`の分離、の3段階の訂正を経て確定）は §B の3エントリ
