background = '''
AI が「製品 `review_system/` が 2026-06-09 を最後に104日間 0 コミットであること」を最重要の欠陥として
報告した。その報告は、目的を「製品を作ること」と推論した上での評価だった。
点検の結果、**この目的は正本のどこにも書かれていなかった**——

```
$ grep -n "ノウハウ|習得|学習|目的は|題材|実験" CLAUDE.md .claude/rules/*.md .ai/guidance/common.md README.md
README.md:15:- **組織学習** — 評価基準が使うほど育ち、ナレッジとして蓄積される
```

ヒットは review_system（製品）の提供価値の1行のみ。`README.md` は製品紹介のまま、`CLAUDE.md` は
「このリポジトリでの仕様策定・設計の進め方」という**手段の説明から**始まっていた。
毎ターン 86,058 文字の規範が注入される環境で、その中に目的が1文字も無かった。

判断内容（移行元）:
> 本リポジトリの目的は、**オーナーが AI 駆動開発のノウハウを獲得すること**である。
> `review_system` はその題材であって目的ではない。**製品の進捗はこのリポジトリの成功指標ではない。**
> ハーネスを作り込んで品質・進捗・コストを改善すること、およびアンチパターンを経験すること自体に価値がある。
> 獲得したノウハウの**転用先は車載 ECU** であり、品質担保はマストである。
>
> 上記を `README.md` と `CLAUDE.md` の冒頭に明記する（実施すること自体は確定・未実施）。
'''
