background = '''
比1.0はU-3提示時点で「条件Bの文言（Qの改善率 < C/Dの悪化率）を計算式に翻訳しただけ」として
提案したもの。連続2窓の閾値も`karte`の既存パターンからの流用として提案した。オーナーは**暫定と
明示した上で決定として採用**——確定的な数値根拠（実測に基づく妥当性検証）は無い。

判断内容（移行元）:
> **比の定義**：
> - Q改善率 ＝ (開始時Q − 終了時Q) / 開始時Q（Qは流出欠陥率＝下がった分がプラス）
> - C悪化率 ＝ (終了時C − 開始時C) / 開始時C
> - D悪化率 ＝ (終了時D − 開始時D) / 開始時D
>
> **条件B該当の判定**：Q改善率 < max(C悪化率, D悪化率)。**判定は常にこの不等式そのもので行う**
> （比 Q改善率÷max(C悪化率,D悪化率) への言い換えは分母が0または負のとき不等号の意味が壊れる
> ため使わない——分母>0のときだけ「比が1.0未満」と同値になる、という限定付きの言い換えに過ぎない）。
>
> **実際の撤退は連続2観測窓の該当で発動**。1窓のみの該当は「注意」記録に留め、撤退ではなく縮退の
> 検討に留める（`karte`の「3ラウンド無進捗エスカレーション」の考え方を流用。観測窓はPRレビュー
> ラウンドよりずっと重い＝数週間単位のため、3ではなく2とした）。

史料編者の状況補足（本人の逐語ではない）:
（比1.0・連続2窓は）
