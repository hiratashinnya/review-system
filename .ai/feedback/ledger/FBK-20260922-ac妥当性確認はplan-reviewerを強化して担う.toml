[narrative]
background = '''
AI が「機能適合性」を④の新規項目として提案した際、それは「実装が AC を満たすか」（検証）だけを
指しており、「AC 自体が正しいか」（妥当性確認）を欠いていた。実例として、**#371 自身の AC に
数値目標が1つも無い**（「計測」節の7項目いずれにも閾値なし）ことを確認した——#371 は
`/gh-create-issue` の構造化テンプレートとオーナー承認を経てなお、この欠陥がすり抜けている。

判断内容（移行元）:
> **「AC 自体が正しいか」（妥当性確認・Validation）は「実装が AC を満たすか」（検証・Verification）とは
> 別の問題であり、④（コード構築の原則）の管轄ではなく①（#371 のプロセス設計）が担う。**
>
> #371 は既に `plan-reviewer` の `PlanReview`（evidence→design→AC→verification のtrace）と、
> 「曖昧AC」を risk gate トリガーとする設計を持つが、2点の穴がある。
> 1. AC 検査が「trace の有無」であって「AC 自体の品質」の構造化チェックリストではない。
> 2. 「曖昧AC」トリガーが AC を書いた `change-planner` 自身の自己申告に依存する（自己認定問題）。
>
> 新規ロールは追加せず、`plan-reviewer`/`PlanReview` を強化する形で対策する。

以前の案・判断の経緯（承認決定とみなさない）: FBK-20260922-機能適合性はac充足の正確性で足りる
> ④に「機能適合性」（AC充足の正確性・完全性）を独立した原則として追加する。
**検証（実装がACを満たすか）と妥当性確認（ACそのものが正しいか）を混同した。** AC自体が誤って
いれば、それを完璧に満たしても無意味——このIssue #371自身の AC に数値目標が1つも無いことが
実例になった。この問題は④（コード構築の原則）ではなく①（#371のプロセス設計）の管轄である。
'''
