判断内容（移行元）:
> 実施順は**⑤→④（明文化のみ）→②→①→③**とする。依存関係に基づく順で、優先度や好みではない：
>
> - **⑤が最初**：①〜④はいずれも「何かを改善する仕組み」。⑤（目的の永続化＋計測指標＋計測機構）が
>   無いと、①〜④が実際に効果を出したかを判定する手段が無い。本台帳の撤退条件（Q改善率の閾値）も
>   計測を前提にしており、⑤が土台であることは本監査の構造そのものが示している。
> - **④は「明文化のみ」を②の前に置く**：本セッション中にAI自身がSSoT/PR1違反を複数回犯した
>   （`.ai/adr/`への混在案・`issue_start/adr/`をChangePlanの置き場と誤読した案・ChangePlanの
>   frame/shard二分に固執した案、いずれもオーナーが訂正）。原則が明文化された判断基準として
>   先に無いと、①②のような新規設計のたびに同種の誤りを繰り返す。ただし機械強制（#539のフル実装）
>   まで待つ必要はなく、チェックリストとして書き出す段階だけを②の前に置く。
> - **②が①より先**：本セッション内で実際に手戻りが発生した実例——②（push権限設計）の確定が
>   ①（#371のV字プロセス本体）の設計より後になり、`tmp/_handoff/`経由の設計を`gitgate adopt-branch`
>   連鎖の直接commit方式へ作り直す手戻りが生じた。権限モデルは役割設計の外枠であり、外枠を
>   後決めすると中身を作り直すことになる。
> - **①が③より先**：③（フィードバックループ＝karte/feedback_ledgerの成熟）は改善対象となる
>   プロセス（①）が実際に動いていて初めて意味を持つ。③の基盤（feedback_ledger・#522）は
>   既にある程度動いているため緊急度も相対的に低い。
