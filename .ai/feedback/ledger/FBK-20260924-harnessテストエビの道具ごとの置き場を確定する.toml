> `tests/designs/TD-issue-start-452*.md`（3件）が実在する——review_systemの`tests/`配下に
> harness（#452）の検証記録が混入済み。`git mv`で`issue_start/verify/{reports,designs}/`へ移設する
> （削除ではなく履歴保全＝PR8区分1）。
>
> **トリガーは#540の実装時点。#452自体の解決を待たない**：#452は2026-09-15時点で`F-452-25`
