> ```
> <tool>/verify/designs/<id>.md          ← TD
> <tool>/verify/reports/<id>-<commit>.md ← TR
> <tool>/verify/logs/<id>-<commit>.txt   ← ログ
> tests/unit/test_<tool>_*.py            ← TC（変更なし）
