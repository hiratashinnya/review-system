verification = ["ST 共通の前提（ST-1〜ST-9）: binding は finding_triager の信頼済み host 側 API（codex_worktree_exec.triage_review_capture.capture_existing と triage_binding_capture.binding_from_capture）が、検証用に乱数生成した鍵 TRIAGER_REVIEW_KEY（32 byte 以上）1 本だけで生成・署名する（receipt・review・binding の署名はすべてこの鍵で検証される）。TRIAGER_CAPTURE_KEY（TRIAGER_REVIEW_KEY とは別の乱数、32 byte 以上）は CLI の実行環境にだけ与え、binding の生成には使わない。両鍵は環境変数に hex 文字列で与える。以下の ST で「host 鍵」と書くものは TRIAGER_REVIEW_KEY を指す。CLI が dispatch の前に行う検査（入れ子起動でないこと、profile pin、project trust、triager の read-only profile 検査 verify_readonly_profile）を通すため、実行環境は次を満たす: 入れ子起動ではない、.codex/config.toml が origin/main と同一の blob（profile pin 一致、この blob は adviser の read-only profile も満たす）、Codex の project trust が登録済み。これとは別に、binding を作る host API（binding_from_capture が呼ぶ github_evidence）の前提として、PR #854 が open でその head が review_oid と一致する（CLI の実行時には検査されない）。reviewer worktree と triager worktree は同じリポジトリの別の登録済み linked worktree で、HEAD は expected.review_oid と一致する。binding は triager worktree の tmp 配下に置く。host 側 API の入力は次のとおり固定する: pr=検証用 draft PR #854、phase=review、round=1、approval は issue・run_id・target_key・snapshot_oid・input_digest・source_changes（承認済みの実装差分の path→sha256）・approval_context・triage_phase=review と、検証設計・変更計画の本文（コミット済み VD/CP の bytes）を持つ。GitHub 依存部分（Issue #783 本文・PR #854 の head と差分）は実際の GitHub から取得し、固定値には置換しない。ST-5 の土台は、全検査を通過する正常な binding（ST-1〜ST-4 の改変を加えないもの）である。ST-5 は鍵の検査より前の untracked と source snapshot の検査も通る必要があるため、triager worktree には tmp 配下の許可拡張子（.json・.md・.yaml・.yml・.txt・.log）以外の untracked ファイル（stale な __pycache__・.coverage など）が無く、--prompt-file は tmp 配下の許可拡張子のファイルとし、基準 snapshot から HEAD への差分は承認済みの source_changes と同 Issue の canonical artifact だけとする。実 CLI は cwd を triager worktree にして python3 -m codex_worktree_exec を起動し、-C に triager worktree の絶対パス（cwd の toplevel と一致させる）、--role finding-triager、--binding-file は cwd 相対で triager worktree の tmp 配下、--prompt-file（内容は使われないが必須）・--output-file（未存在の新規パス）・--binding-file・--model と --reasoning-effort（model_policy の解決結果）を指定する。いずれの ST も、拒否は codex 子プロセスの起動前に起きるため stub は不要。観測点は終了コード 2・標準エラーの CODEX_EXEC_TRIAGER_INVALID とケース別メッセージ・出力ファイルが作られないこと。", "ST-1 binding 署名: binding_signature だけを 64 桁の 0 に置換する。標準エラーに host binding signature mismatch を含む。", "ST-2 receipt 署名: receipt_signature を別の値に置換し、binding_signature を host 鍵で再計算して整合させる（binding 署名検査を通過させる）。標準エラーに reviewer capture signature mismatch を含む。", "ST-3 作業面 HEAD と review_oid の不一致: triager worktree の HEAD を、expected.review_oid の子にあたる空 commit（.codex/config.toml を変えない）に切り替える。標準エラーに triager snapshot mismatch を含む。", "ST-4 reviewer と triager の同一化: binding の reviewer_worktree を triager 自身の worktree にして host 鍵で再署名する。標準エラーに reviewer must be a distinct registered worktree を含む。", "ST-5 鍵の分離: TRIAGER_CAPTURE_KEY を TRIAGER_REVIEW_KEY と同じ値にする。標準エラーに distinct trusted capture key required を含む。", "ST-6 reviewer worktree の未登録: binding の reviewer_worktree を、実在するが git の worktree に登録されていないディレクトリにする（reviewer の検査は署名検査より前のため再署名は不要）。標準エラーに reviewer must be a distinct registered worktree を含む（ST-4 が triager 自身を指す分岐、ST-6 が未登録の分岐）。", "ST-7 capture 鍵の長さ: TRIAGER_CAPTURE_KEY を TRIAGER_REVIEW_KEY と異なる 31 byte の hex にする。標準エラーに distinct trusted capture key required を含む（ST-5 が同値の分岐、ST-7 が短い鍵の分岐）。", "ST-8 reviewer の出所: 署名済み review の reviewer_worktree だけを別の実在パスに変え、review_signature と binding_signature を host 鍵で再計算する（binding 側の reviewer_worktree は triager と別の登録済み worktree のまま）。標準エラーに reviewer origin mismatch を含む。", "ST-9 承認済み source の digest: 承認済み source_changes が 1 件以上ある状態で、receipt の approval.source_changes の digest を 1 件だけ誤った値に変え、receipt_signature と binding_signature を host 鍵で再計算する。標準エラーに approved source digest mismatch を含む。", "UT-1 正常系: 署名・全束縛項目が一致する入力で verify_review が dict を返し、各束縛項目が expected と一致する。", "UT-10 capture の digest: verify_capture で、署名済みだが review_sha256 または context_sha256 が review と異なる capture は、ValueError(capture binding mismatch)。2 項目を個別に確認する。", "UT-11 review の構造: verify_review で、署名済みだが次の入力を ValueError で拒否する（review と expected を同じ値にして束縛一致を通過させる）。JSON でない bytes は invalid review JSON、phase が review/remediation_review 以外・issue または round が整数でないか 1 未満・producer が pr-reviewer 以外は invalid review envelope、run_id または target_key が空文字は invalid run_id と invalid target_key、reviewer_worktree が絶対パスでないものは invalid signed reviewer worktree。メッセージは完全一致で確認する。", "UT-12 findings の構造: verify_review で、署名済みだが次の入力を ValueError で拒否する。findings が配列でない・要素が object でないものは invalid findings、finding_id が空・重複は invalid finding ids、harm が real/none 以外・scope が in/out 以外・severity が minor/major/blocker 以外は invalid review judgments、harm_detail または evidence が空は missing reviewer rationale。メッセージは完全一致で確認する。", "UT-13 鍵: verify_review に 32 byte 未満の鍵を渡すと ValueError(trusted signing key required)。adapter の propose に review 鍵と capture 鍵に同じ値を渡すと ValueError(review and capture keys must differ)。verify_context に bytes でない context、または文字列でない digest を渡すと ValueError(trusted context and digest required)。メッセージは完全一致で確認する。", "UT-14 receipt の束縛: triage_binding_verify の verify_binding_capture を、正しい署名の binding（同モジュールの sign_binding と receipt の署名を host 鍵で作ったもの）で呼ぶ。EXTRA の項目を欠く binding・dict でない値は ValueError(host review capture required)。receipt の schema が finding-triage-review-capture/v1 以外・producer が pr-reviewer 以外・source が ingested-review 以外・phase または round が review と異なる・approval の triage_phase が review の phase と異なる・worktree が binding の reviewer_worktree と異なる・review_oid が review と異なる・review_sha256 が reviewer_output の sha256 と異なる、のいずれか 1 項目だけを変えたものは ValueError(reviewer capture mismatch)。approval の issue・run_id・target_key・snapshot_oid・input_digest のいずれか 1 項目だけが review と異なる場合も同じ例外（5 項目を個別に確認する）。reviewer_output から再構成した findings が review の findings と異なる場合は ValueError(reviewer finding differs from captured original)。署名の検査（ST-1・ST-2）は UT でも各 1 件確認する。メッセージは完全一致で確認する。", "UT-15 binding ファイル: triager_dispatch の validate_binding を、git の呼び出しより前に拒否される入力で、一時ディレクトリの worktree を使って呼ぶ。binding_file が None は ValueError(trusted triager binding required)。binding のパスの途中に symlink があるものは ValueError(symlink in triager binding path)。worktree の tmp の外にあるファイルは ValueError(binding must be in worktree tmp)。項目集合が review/review_signature/expected/context/context_digest/reviewer_worktree と EXTRA の和集合と異なるものは ValueError(invalid triager binding fields)。メッセージは完全一致で確認する。", "UT-2 署名不一致: 別鍵の署名で ValueError(review signature mismatch)。raw を 1 byte 変えた場合も同じ例外。", "UT-3 束縛項目の不一致: issue/phase/round/run_id/target_key/input_digest/snapshot_oid/review_oid の 8 項目それぞれについて、expected の当該項目だけを変えて ValueError(review binding mismatch)。review_oid を含む 8 項目を個別に確認する。", "UT-4 形式不正: input_digest・snapshot_oid・review_oid は、署名済み review と expected の双方を同じ不正値（16 進でない、または桁数違い）にして束縛を一致させ、ValueError(invalid <field>) を完全一致で確認する。context_sha256 は BINDINGS に含まれないため review 側だけを不正値にし、expected はそのままにして ValueError(invalid context_sha256) を完全一致で確認する。", "UT-5 欠落: 署名済み review から束縛項目を 1 つずつ欠落させて再署名すると ValueError(invalid review fields)。expected からキーを 1 つずつ欠落させると ValueError(review binding mismatch)。キー集合の検査を外した変異で Red になること。", "UT-6 context digest: verify_context で、context bytes を 1 byte 変えると ValueError(context digest mismatch)。context_digest が署名済み review の context_sha256 と異なる場合は ValueError(context is not bound to signed review)。署名と digest が整合した context でも次を ValueError で拒否する: JSON でない bytes は invalid context JSON、項目集合が issue/snapshot_oid/review_oid/input_digest/approval_ref/documents と異なるものは invalid context envelope、approval_ref が空文字または文字列でないものは missing approved design reference、documents のカテゴリ集合が ac/vd_cp/design/change と異なるものは missing context categories、いずれかのカテゴリが空文字または文字列でないものは empty context category。メッセージは完全一致で確認する。", "UT-7 capture 署名: verify_capture で、capture bytes を 1 byte 変えると ValueError(capture signature mismatch)。32 byte 未満の鍵は ValueError(trusted capture key required)。署名済みだが束縛項目が review と異なる capture は ValueError(capture binding mismatch)。束縛項目は issue/phase/round/run_id/target_key/input_digest/snapshot_oid/review_oid の 8 項目それぞれについて、capture の当該項目だけを変えて個別に確認する（UT-3 と同じ粒度）。署名済みの capture でも次を ValueError で拒否する: JSON でない bytes は invalid capture JSON、項目集合が 8 束縛項目と producer・review_sha256・context_sha256・assessments の和集合と異なるものは invalid capture fields、producer が finding-triager 以外のもの、および assessments が配列でないものは capture binding mismatch。メッセージは完全一致で確認する。", "UT-8 成果物の再計算: validate_proposal に、再計算結果と一致する未改変の triage artifact を渡すと、同一内容の dict が返る（受理側）。candidate を書き換えた triage artifact を渡すと ValueError(triage artifact mismatch)（拒否側）。", "UT-9 context の対象束縛: verify_context で、署名済み review の issue・snapshot_oid・review_oid・input_digest のいずれか 1 項目だけが context の同項目と異なる場合、ValueError(context target mismatch)。4 項目を個別に確認する。", "テストレベル: UT（単体）の対象関数は verify_review(raw, signature, key, expected)（UT-1〜UT-5・UT-11〜UT-13）、adapter の propose（UT-13）、triage_binding_verify の verify_binding_capture（UT-14）、triager_dispatch の validate_binding の git 呼び出し前の検査（UT-15）、verify_context（UT-6・UT-9・UT-13）、verify_capture（UT-7・UT-10）、validate_proposal（UT-8）で、それぞれを直接呼び、観測点は戻り値と送出される例外の型・メッセージ（完全一致）。ST（システム）は実 CLI の入口の拒否 ST-1〜ST-9 を扱い、ST-TC-AC5 はその識別子。IT は対象外。UT-TD/UT-TC は 2a で受ける。", "前提: AC-5 は Issue #783 の AC5 の前半「署名・digest・OID など入力整合を欠くものは採用しない」だけを指す。後半「元成果を改変しない」は、verify_review が不変の bytes だけを受け取り原本ファイルへの書込み経路を持たないため、この関数単体では検証できず本 VD の対象外（Issue #852 の E01・E07 で、実 CLI の実行前後の原本 sha256 比較として扱う）。AC5 前半の対象は、署名（review・capture・binding・receipt）、digest（context）、OID（review_oid・snapshot_oid・HEAD）、束縛項目の欠落と形式の各拒否経路で、下記 UT-1〜UT-15 と ST-1〜ST-9 が対応する（網羅していない経路は後述の対象外として列挙する）。AC5 前半の対象外とする経路: 出力先の扱い（triager output must be new・triager output collision）と子プロセス失敗（triager process failed、Issue #852 の E09 で扱う）は入力整合の拒否ではない。role・harm 契約の欠落（adapter の role or harm contract missing）と assessments の網羅（assessments must cover each finding）は評価の完全性で、Issue #783 の AC3 の範囲。AC5 前半の入力整合の拒否経路は、下記の UT・ST と、直前に挙げた対象外の経路で尽きる。承認の基準（snapshot）のコードでは、verify_review が束縛項目の比較から review_oid を除外している（finding_triager/inputs.py の比較に k != 'review_oid' がある）。このため UT-3 の review_oid のケースだけが基準コードで Red（実装未了による失敗）になり、review_oid を比較に含める修正が計画の WU-1 である。UT-3 の review_oid 以外のケースと、UT-1・UT-2・UT-4〜UT-15・ST-1〜ST-9 は基準コードで Green になり（基準コードで Red になるのは UT-3 の review_oid のケースだけ）、基準コードの挙動に基づく。st_td は AC ID の集合で CP の work_units.ac_refs と一致する（issue_envelope/coverage.py の定義）。input_digest は取得時点の Issue #783 本文（gh issue view の body 文字列を UTF-8 で符号化した bytes）の sha256。input_refs は artifact ID 専用で Issue 本文は参照できないため空。"]
