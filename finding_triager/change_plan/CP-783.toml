selected_solution = '''
AC-5（Issue #783 AC5 前半: 入力整合を欠く成果は採用しない）。変更は WU-1 の 1 件だけで、finding_triager/inputs.py の verify_review が、呼び出し側の期待値 expected と署名済み review を照合する束縛項目の比較から review_oid を除外している現行の挙動（比較に k != "review_oid" がある）を改め、8 項目（issue/phase/round/run_id/target_key/input_digest/snapshot_oid/review_oid）の全てを比較に含める。1 項目でも不一致なら review を採用しない。これは VD-783 の UT-3 の review_oid のケースが基準コードで Red になる、実装未了の振る舞いである。それ以外の検証ケース（VD-783 の UT-1・UT-2・UT-3 の review_oid 以外の項目・UT-4〜UT-15 と ST-1〜ST-12）は基準コードで既に成立しており、本計画では変更せず、回帰を固定する対象として VD-783 を参照する。
'''
interfaces = '''
関数として直接呼ぶ範囲: verify_review(raw: bytes, signature: str, key: bytes, expected: dict) -> dict、verify_context(raw, expected_digest, review) -> dict、verify_capture(raw, signature, key, review, review_raw, context_digest) -> list（assessments を返す）、validate_proposal(artifact, ...) -> dict、adapter の propose（UT-13）、codex_worktree_exec.triage_binding_verify.verify_binding_capture（UT-14）は、不一致・欠落・形式不正を ValueError で拒否する（正確な引数は基準コードの定義に従う）。CLI 経由の範囲: codex_worktree_exec の dispatch は、validate_binding を含む処理で送出される ValueError・KeyError・TypeError・OSError・subprocess のエラーを CodexExecError(CODEX_EXEC_TRIAGER_INVALID) に変換する（ST-1〜ST-12 の対象。validate_binding の git 呼び出し前の検査は UT-15 でも直接呼んで確かめる）。
'''
invariants = '''
次の不変条件を維持し、各条件を VD-783 のケースで固定する。(1) 署名: review の署名（UT-2）、capture の署名（UT-7）、binding の署名（ST-1）、receipt の署名（ST-2）が正しいものだけを採用する。(2) 束縛: verify_review は expected と署名済み review の 8 項目（issue/phase/round/run_id/target_key/input_digest/snapshot_oid/review_oid）の全てを照合し、除外される項目はない（UT-3、WU-1 で review_oid を含める）。verify_capture は capture と review の 8 項目を照合し（UT-7）、review_sha256 と context_sha256 も照合する（UT-10）。verify_context は context と review の issue/snapshot_oid/review_oid/input_digest の 4 項目を照合し（UT-9）、context digest を検査する（UT-6）。(3) 形式・欠落・構造・鍵の拒否（UT-4・UT-5・UT-11・UT-12・UT-13）。receipt の束縛と binding ファイルの検査（UT-14・UT-15）。(4) triager worktree の HEAD は review_oid と一致する（ST-3）。(5) reviewer worktree は triager 自身と別の登録済み worktree で（ST-4・ST-6）、署名済み review の reviewer_worktree と一致する（ST-8）。(6) review 鍵と capture 鍵は別で、capture 鍵は 32 byte 以上（ST-5・ST-7）。(7) 承認済み source の digest が一致する（ST-9）。(8) snapshot からの差分は承認済み source_changes（digest が完全一致）と同じ Issue の canonical artifact に限られる（満たさない変更は source snapshot の検査で拒否される・ST-9・ST-12）。tracked ファイルが HEAD と一致することは require_clean_tracked が担うが、その単独の拒否経路は VD-783 では検証せず未検証のリスクとして残す。
'''
failure_behavior = '''
関数として直接呼ぶ範囲では、不一致・署名不正・欠落・形式不正は ValueError で拒否する。CLI 経由では、拒否は CodexExecError(CODEX_EXEC_TRIAGER_INVALID) となり、終了コード 2、標準エラーに codex_worktree_exec: CODEX_EXEC_TRIAGER_INVALID: <メッセージ> を出し、指定された出力ファイルを作らない（fail-close）。validate_binding の検査（ST-1〜ST-12 の範囲）は codex 子プロセスの起動前に CODEX_EXEC_TRIAGER_INVALID・終了コード 2 で拒否する。出力 JSON の解析失敗・capture の束縛不一致は起動後に同じ CODEX_EXEC_TRIAGER_INVALID で拒否される。子プロセスの非 0 終了は launcher が CODEX_REVIEW_CODEX_FAILED（終了コード 2）、timeout は CODEX_EXEC_TIMEOUT（終了コード 124）、起動失敗は CODEX_EXEC_LAUNCH_FAILED で拒否し、dispatch 前の profile 検査は CODEX_EXEC_TRIAGER_PROFILE で拒否する。いずれの場合も triage 成果物は生成されない。
'''
oos = '''
triage の自動処置・台帳更新・merge は対象外。AC5 後半（元成果の不変）は Issue #852 の E01・E07 の実行前後の原本 sha256 比較で扱い、子プロセス失敗は E09（VD-783 の前提が挙げる triager process failed のメッセージを出す分岐は、launcher が非 0 終了を先に例外にするため到達しない。分岐を削るか整合させるかは #783 の担当の判断で、本 CP では変更しない）、評価の完全性は #783 の AC3 で扱う。出力先の扱い（triager output must be new）は VD-783 にも本 CP にも割り当てが無く、未割当のまま残す。AC5 前半の ST-1〜ST-12 は対象外ではなく、下の operational_verification に従い 2b の PR で実施する。ST-1〜ST-12 が実測する codex_worktree_exec の既存の拒否経路は、本計画では変更しない（変更対象は finding_triager のみで、scope と WU-1 はその変更対象を指す）。
'''
operational_verification = '''
2a で VD-783 の UT-1〜UT-15 を UT-TD/UT-TC として著作する。ゲート（全 UT-TC に Red 証拠が一対一で必要）に合わせ、UT-3 の review_oid のケースを含む 1 つの UT-TC ファイルに UT-1〜UT-15 をまとめ、そのファイルが基準コードで失敗する（exit_code>0）ことを Red 証拠とし、ログで、失敗したテスト ID の集合が UT-3 の review_oid のケース 1 件と一致し、他の UT は全て成功し、収集エラー・import エラーが 0 件であることを確認する（環境不備や収集失敗を Red の成功として扱わない）。2b で WU-1 を実装して全 UT を Green にする。ST-1〜ST-12 は 2b の PR を対象に、Issue #852 の E07（署名・digest・OID 不一致の拒否）の範囲として実 CLI で実施する。結果の記録先は Issue #852 のコメントのみとする。オーナー判断（FBK-20261122-852のstの記録はissueコメントのみとする）: Issue #852 は検証仕様の唯一の正本であり、ST は検証用の一度限りの live 確認なので、共通契約が求める finding_triager/verify への ST の TD/TC/TR の永続化は行わず、別の検証 Issue も起こさない。この判断は #852 の検証に限る例外で、既存の台帳決定 FBK-20260924（検証エビは全レベルで TD/TC/TR を揃える）を覆さない。#852 への記録は、検証を実施する主文脈が結果コメントとして行う。ST は PR #854 が open でその head が review_oid と一致することに依存し、2b の PR の確定 HEAD で実施する。この時点の snapshot からの非 envelope 差分は、WU-1 の finding_triager/inputs.py、2a の UT-TC の .py ファイル、Red/Green の実行ログの path で、承認済み source_changes にはこれらの path 全てを、commit 済みの内容の sha256 とともに列挙する（VD-783 の ST-9 が「基準コードでは実装差分が空」と書く作り方は、2b ではこの全集合に読み替える。ST-9 の拒否条件は、列挙した 1 件の digest を誤った値にすることで同じである）。approval と receipt は、ST を実施する主文脈が確定 HEAD から作り、実 reviewer の capture（round=1）を取得した上で実施する。2b の Green 判定の範囲は WU-1 の変更と VD-783 の UT に限り、tests/unit の既存テスト test_readonly_source_gate_rejects_tracked_worktree_edits は基準コードの時点で既に ERROR（共有の source snapshot の挙動とテストの期待が逆）で、オーナー判断（FBK-20261122-既存テストとコードの矛盾は範囲外で記録する）により、PR #816 側の不具合として Issue #852 に記録し、どちらを正とするかは #783 の担当に委ね、本 CP の対象外・未解決として残す。PR #854 の CI のうち tests/unittest はこの 1 件のために 2b でも赤のまま残りうる。
'''
